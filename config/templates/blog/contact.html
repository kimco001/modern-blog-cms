{% extends 'blog/base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-4xl font-bold mb-8">Get In Touch</h1>
    
    <p class="text-gray-600 dark:text-gray-400 mb-10 text-lg">
        Have a question or want to collaborate? Feel free to reach out!
    </p>

    <div class="bg-white dark:bg-gray-900 p-8 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700">
        <form method="post">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Your Name</label>
                    <input type="text" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-2xl bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Email Address</label>
                    <input type="email" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-2xl bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100" placeholder="you@example.com">
                </div>
            </div>
            
            <div class="mt-6">
                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Message</label>
                <textarea rows="6" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-2xl bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100" 
                          placeholder="Write your message here..."></textarea>
            </div>
            
            <button type="submit" 
                    class="mt-8 bg-blue-600 hover:bg-blue-700 text-white font-medium px-10 py-4 rounded-2xl transition">
                Send Message
            </button>
        </form>
    </div>
</div>
{% endblock %}
